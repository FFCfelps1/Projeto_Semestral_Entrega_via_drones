---
apiVersion: v1
kind: Service
metadata:
  name: barramento-eventos
spec:
  selector:
    app: barramento-eventos
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barramento-eventos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barramento-eventos
  template:
    metadata:
      labels:
        app: barramento-eventos
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: barramento-eventos
          image: docker.io/library/skyswift-barramento-eventos:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: skyswift-config
          env:
            - name: PORT
              value: '3001'
            - name: SERVICE_URL
              value: http://barramento-eventos:3001
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /live, port: 3001}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: 3001}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: 3001}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
---
