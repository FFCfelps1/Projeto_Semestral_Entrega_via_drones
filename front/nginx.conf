server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /live { access_log off; return 200 'ok'; }
    location = /ready { access_log off; return 200 'ok'; }
    location /api/barramento_eventos/ {
        proxy_pass http://barramento-eventos:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    location /api/entrega_via_drone/ {
        proxy_pass http://entrega-via-drone:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    location /api/contato_email/ {
        proxy_pass http://contato-email:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    location /api/cadastro_usuario/ {
        proxy_pass http://cadastro-usuario:3004/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    location /api/gestao_de_pedidos/ {
        proxy_pass http://gestao-de-pedidos:3005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    location /api/notificacoes/ {
        proxy_pass http://notificacoes:3006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    location /api/ { default_type application/json; return 404 '{"erro":"Rota nao encontrada"}'; }
    location / { try_files $uri $uri/ /index.html; }
}
