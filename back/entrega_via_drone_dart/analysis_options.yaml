# Regras de analise estatica do microsservico Dart.
# Parte do conjunto recomendado oficial e acrescenta regras de estilo do projeto.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - unawaited_futures
